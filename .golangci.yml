# golangci-lint v2 configuration for zen-cleaner.
# The "standard" default set (errcheck, govet, ineffassign, staticcheck, unused)
# is kept; gofmt enforcement and the cyclop complexity gate are added on top.
version: "2"

linters:
  default: standard
  enable:
    - cyclop
  settings:
    cyclop:
      # Fleet census 2026-10-22: current production max is 24
      # (cmd/zen-cleaner runMain, by cyclop counting). Gate holds at 25;
      # tighten as refactors land.
      max-complexity: 25

formatters:
  enable:
    - gofmt
