# golangci-lint v2 configuration for zen-cleaner.
# The "standard" default set (errcheck, govet, ineffassign, staticcheck, unused)
# is kept; gofmt enforcement and the cyclop complexity gate are added on top.
version: "2"

linters:
  default: standard
  enable:
    - cyclop
  settings:
    cyclop:
      # Fleet census 2026-10-22: current production max is 17
      # (pkg/controller Reconcile, by cyclop counting). Gate tightened to
      # 20 after the runMain / validateTargetResource /
      # CalculateExpirationTime / UpdateStatus refactors.
      max-complexity: 20
  # Test files are excluded from the complexity gate: pre-existing
  # high-complexity test helpers (e.g. test/repo guard suites) already
  # exceeded the old production-only gate and are out of scope for
  # production refactors.
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - cyclop

formatters:
  enable:
    - gofmt
