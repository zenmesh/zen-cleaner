image:
  repository: ghcr.io/zenmesh/zen-cleaner
  # Pinned version tag; never use :latest for production installs (D039 §4).
  # Kept in step with Chart.yaml appVersion AND with a version that actually
  # has a published image. 0.1.0 has NO image: its build failed (the builder
  # digest was Debian, not Alpine), so a default of 0.1.0 installs a tag that
  # resolves to nothing. The release workflow rebinds BOTH `tag` and `digest`
  # at package time; when `digest` is set it wins over `tag`.
  tag: "0.1.17"
  digest: ""
  pullPolicy: IfNotPresent

replicas: 1

leaderElection:
  enabled: true

rbac:
  # Explicit allowlist of resource classes the controller may collect
  # (default deny; no wildcards). Grant only what the controller should
  # manage in your deployment.
  targetKinds:
    - group: batch
      resource: jobs
  # true: deletion is confined to the release namespace + rbac.deleteNamespaces
  # (Roles); reads are always cluster-wide. false: deletion is granted
  # cluster-wide (ClusterRole). NOTE: the controller's own namespace is
  # safety-protected — with namespaceScope=true, list the USER namespaces
  # you intend to clean in rbac.deleteNamespaces or nothing can be deleted.
  namespaceScope: true
  # Additional USER namespaces where deletion is authorized when
  # namespaceScope=true (each gets its own namespaced Role/RoleBinding).
  deleteNamespaces: []

networkPolicy:
  enabled: true
  # Egress is restricted to: TCP/443 and TCP/6443 to destinations covered by
  # egressCidr, plus DNS (UDP/TCP 53) to kube-system. The Kubernetes API is a
  # host-network endpoint, so it is addressed by CIDR; the embedded
  # kube-router engine on k3s matches egress rules against the POST-DNAT
  # endpoint tuple, which is why the API port (6443 on k3s/kubeadm) must be
  # listed even though clients dial 443 (verified by probe matrix,
  # 2026-10-29). "443+6443 to 0.0.0.0/0" is broader than the historical
  # "API + DNS only" wording: a compromised controller may also reach any
  # OTHER service listening on 443/6443 anywhere egress routes to. To
  # harden, set egressCidr to the cluster's node/pod network (e.g.
  # "10.0.0.0/8") so the API allowance stops at in-cluster destinations.
  egressCidr: "0.0.0.0/0"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits: {}

probes:
  readiness:
    initialDelaySeconds: 3
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 15

podDisruptionBudget:
  # SUPPORT2-033 §14: applies only when replicas > 1.
  enabled: true
  minAvailable: 1
