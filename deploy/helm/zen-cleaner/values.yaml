image:
  repository: ghcr.io/zenmesh/zen-cleaner
  # Pinned version tag; never use :latest for production installs (D039 §4).
  # Kept in step with Chart.yaml appVersion and the published release.
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

replicas: 1

leaderElection:
  enabled: true

rbac:
  # Explicit allowlist of resource classes the controller may collect
  # (default deny; no wildcards). Grant only what the controller should
  # manage in your deployment.
  targetKinds:
    - group: batch
      resource: jobs
  # true: deletion is confined to the release namespace + rbac.deleteNamespaces
  # (Roles); reads are always cluster-wide. false: deletion is granted
  # cluster-wide (ClusterRole). NOTE: the controller's own namespace is
  # safety-protected — with namespaceScope=true, list the USER namespaces
  # you intend to clean in rbac.deleteNamespaces or nothing can be deleted.
  namespaceScope: true
  # Additional USER namespaces where deletion is authorized when
  # namespaceScope=true (each gets its own namespaced Role/RoleBinding).
  deleteNamespaces: []

networkPolicy:
  enabled: true
  # Minimum egress: Kubernetes API + DNS only.

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits: {}

probes:
  readiness:
    initialDelaySeconds: 3
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 15

podDisruptionBudget:
  # SUPPORT2-033 §14: applies only when replicas > 1.
  enabled: true
  minAvailable: 1
