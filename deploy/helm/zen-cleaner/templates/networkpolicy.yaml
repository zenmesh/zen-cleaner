{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-zen-cleaner
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zen-cleaner
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Egress]
  egress:
    # TLS egress: TCP/443 and TCP/6443 to ANY destination. The Kubernetes
    # API server is a host-network address (the kubernetes Service resolves
    # to it), not a pod, so it can only be selected by CIDR; a
    # namespaceSelector rule never matches it and some CNIs REJECT the
    # unmatched egress outright. This is therefore NOT an "API-only" rule:
    # any HTTPS destination is reachable (an optional operator-tightened API
    # CIDR may replace it).
    #
    # WHY 6443 IS PART OF THE CONTRACT (verified by probe matrix on k3s
    # v1.35.5 + v1.37.0, 2026-10-29): the embedded kube-router network
    # policy engine matches EGRESS rules against the POST-DNAT endpoint
    # tuple. A dial to the API ClusterIP :443 is translated to
    # <endpoint>:6443 before the policy chain evaluates, so a 443-only rule
    # never matches the API path and the controller is denied API access
    # (silently leaderless in <=0.1.3). Allowing the API port explicitly
    # preserves the intended posture — HTTPS-class egress + DNS only —
    # while keeping the policy enforced (non-listed ports stay denied,
    # verified by probe).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    # DNS: CoreDNS pods live in kube-system; TCP is needed for large replies.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
