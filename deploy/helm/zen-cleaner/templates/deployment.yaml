apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-zen-cleaner
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: zen-cleaner
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: zen-cleaner
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zen-cleaner
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}-zen-cleaner
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # SUPPORT2-033 §14: hardened container context.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          args:
            - "--metrics-addr=:8080"
            - "--enable-webhook=false"
            - "--leader-election={{ .Values.leaderElection.enabled }}"
            - "--leader-election-namespace={{ .Release.Namespace }}"
          ports:
            - name: metrics
              containerPort: 8080
            # controller-runtime serves health probes (/healthz) on its own
            # bind address (:8081), NOT on the metrics port — probing the
            # metrics port 404s and crash-loops the pod.
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- if and .Values.podDisruptionBudget.enabled (gt (int .Values.replicas) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-zen-cleaner
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: zen-cleaner
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
