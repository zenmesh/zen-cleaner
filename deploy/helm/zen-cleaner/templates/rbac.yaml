{{- $kinds := .Values.rbac.targetKinds }}
{{- $scope := .Values.rbac.namespaceScope }}
{{- /* Fail loudly on malformed allowlist entries. Helm's `--set
rbac.targetKinds[N].resource=x` with an index beyond the current list length
emits a NULL list element; rendering that silently produced an
"?invalid-target" rule in a live ClusterRole/Role while dropping the real
allowlist (found on the public install). Corrupt RBAC must never render —
the install must stop with the corrected spelling instead. */}}
{{- range $kinds }}
{{- if or (not (kindIs "map" .)) (not .resource) }}
{{- fail (printf "rbac.targetKinds entries must be maps with a non-empty resource field, e.g. {group: batch, resource: jobs}; offending entry: %v. Helm --set with an index beyond the current list length creates a null entry — set every index explicitly (rbac.targetKinds[0]... AND rbac.targetKinds[1]...)." .) }}
{{- end }}
{{- end }}
# Read access: policies and target resource classes are read cluster-wide
# (shared controller cache), while the dangerous verb -- delete -- is bounded
# by namespaceScope below.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-zen-cleaner-read
rules:
  - apiGroups: ["cleaner.zen-mesh.io"]
    resources: ["zencleanerpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cleaner.zen-mesh.io"]
    resources: ["zencleanerpolicies/status"]
    verbs: ["get", "update", "patch"]
  {{- range $kinds }}
  {{- $g := "" }}
  {{- if kindIs "map" . }}
  {{- $g = .group | default "" }}
  {{- end }}
  # a null/absent group means the core API group (RBAC "" convention) —
  # helm --set cannot express "" cleanly (null collapses the element), so a
  # missing/absent group field is the lawful core-group spelling.
  - apiGroups: [{{ $g | quote }}]
    resources: [{{ .resource | quote }}]
    verbs: ["get", "list", "watch"]
  {{- end }}
  # Events: the controller emits policy evaluation/deletion events into the
  # POLICY's namespace (which may be any namespace), mirroring the canonical
  # raw-manifest ClusterRole. Without this, event recording is rejected for
  # policies outside the release namespace.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-zen-cleaner-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-zen-cleaner-read
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-zen-cleaner
    namespace: {{ .Release.Namespace }}
---
# Delete access: confined to the release namespace when namespaceScope=true;
# a ClusterRole grants cluster-wide delete when namespaceScope=false.
{{- /* The controller's OWN namespace is safety-protected (pkg/safety), so
with namespaceScope=true the release-namespace Role alone authorizes deletes
nowhere. rbac.deleteNamespaces lists the USER namespaces where deletion is
intended; each gets its own least-privilege Role + RoleBinding (release
namespace deduped). The cluster-wide branch renders EXACTLY ONCE —
deleteNamespaces are meaningless for ClusterRoles and must never produce
duplicate identities. */}}
{{- if $scope }}
{{- $deleteNamespaces := uniq (prepend .Values.rbac.deleteNamespaces .Release.Namespace) }}
{{- range $dn := $deleteNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Release.Name }}-zen-cleaner-delete-{{ $dn }}
  namespace: {{ $dn }}
rules:
  {{- range $kinds }}
  {{- $g := "" }}
  {{- if kindIs "map" . }}
  {{- $g = .group | default "" }}
  {{- end }}
  - apiGroups: [{{ $g | quote }}]
    resources: [{{ .resource | quote }}]
    verbs: ["delete"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-zen-cleaner-delete-{{ $dn }}
  namespace: {{ $dn }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Release.Name }}-zen-cleaner-delete-{{ $dn }}
subjects:
  - kind: ServiceAccount
    name: {{ $.Release.Name }}-zen-cleaner
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- else }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $.Release.Name }}-zen-cleaner-delete
rules:
  {{- range $kinds }}
  {{- $g := "" }}
  {{- if kindIs "map" . }}
  {{- $g = .group | default "" }}
  {{- end }}
  - apiGroups: [{{ $g | quote }}]
    resources: [{{ .resource | quote }}]
    verbs: ["delete"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $.Release.Name }}-zen-cleaner-delete
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $.Release.Name }}-zen-cleaner-delete
subjects:
  - kind: ServiceAccount
    name: {{ $.Release.Name }}-zen-cleaner
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- if .Values.leaderElection.enabled }}
---
# Leader election: leases and events in the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-zen-cleaner-leader
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-zen-cleaner-leader
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-zen-cleaner-leader
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-zen-cleaner
    namespace: {{ .Release.Namespace }}
{{- end }}
