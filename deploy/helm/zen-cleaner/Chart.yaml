annotations:
  # Artifact Hub annotation (https://artifacthub.io/docs/topics/annotations/helm/)
  artifacthub.io/changes: |
    - kind: added
      description: Release 0.1.2: published OCI chart, digest-bound image and dependency updates.
    - kind: changed
      description: Builder image pinned to golang:1.27.3-alpine — the Go 1.27.3 toolchain carries the GO-2026-6809 crypto/x509 fix.
    - kind: added
      description: API-reachability observation on the leader-election lock — unreachable states surface as Warning events (APIUnreachable), a zen_cleaner_api_reachable metric, /leaderz detail and a NOT-Ready /readyz, without conflating follower status with failure.
    - kind: fixed
      description: The readiness probe now targets the leadership-aware /readyz law; probing the process-level liveness endpoint left pods reporting Ready while unable to reach the API (observed under NetworkPolicy enforcement on k3s).
    - kind: fixed
      description: The default egress NetworkPolicy now allows TCP/6443 alongside 443 — the kube-router policy engine (k3s) matches rules against the post-DNAT endpoint port, so the API path (ClusterIP:443 -> endpoint:6443) was denied under a 443-only rule, leaving the controller leaderless under enforcement. Enforcement of non-listed ports verified unchanged.
    - kind: fixed
      description: APIUnreachable pod events no longer require POD_NAME to be projected (HOSTNAME fallback).
    - kind: added
      description: Structured-log event sink retained on the broadcaster — APIUnreachable (and every other event) stays visible in kubectl logs while the API sink cannot deliver (NetworkPolicy-enforced egress rejection).
    - kind: added
      description: networkPolicy.egressCidr values knob — narrow the 443/6443 API allowance to the cluster network (default 0.0.0.0/0 unchanged).
    - kind: fixed
      description: Startup Lease-NotFound no longer emits a false APIUnreachable event pair — API-response errors classify as reachable; only transport failures mean unreachable.
