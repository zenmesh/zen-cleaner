apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: zen-cleaner-mutating-webhook
  annotations:
    cert-manager.io/inject-ca-from: zen-cleaner-system/zen-cleaner-webhook-cert
webhooks:
  - name: mutate-cleanup-policy.cleaner.zen-mesh.io
    clientConfig:
      service:
        name: zen-cleaner-webhook
        namespace: zen-cleaner-system
        path: "/mutate-cleanup-policy"
    rules:
      - apiGroups: ["cleaner.zen-mesh.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE"]
        resources: ["zencleanerpolicies"]
    admissionReviewVersions: ["v1", "v1beta1"]
    sideEffects: None
    failurePolicy: Fail
