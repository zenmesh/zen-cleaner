apiVersion: v1
kind: Service
metadata:
  name: zen-cleaner-webhook
  namespace: ${WEBHOOK_NAMESPACE}
spec:
  ports:
    - port: 443
      targetPort: 9443
  selector:
    app: zen-cleaner
# yamllint disable rule:document-start
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: zen-cleaner-validating-webhook
  annotations:
    cert-manager.io/inject-ca-from: zen-cleaner-system/zen-cleaner-webhook-cert
webhooks:
  - name: validate-cleanup-policy.cleaner.zen-mesh.io
    clientConfig:
      service:
        name: zen-cleaner-webhook
        namespace: ${WEBHOOK_NAMESPACE}
        path: "/validate-cleanup-policy"
      caBundle: ${WEBHOOK_CA_BUNDLE}
    rules:
      - apiGroups: ["cleaner.zen-mesh.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["zencleanerpolicies"]
    admissionReviewVersions: ["v1", "v1beta1"]
    sideEffects: None
    failurePolicy: Fail
