apiVersion: v1
kind: ServiceAccount
metadata:
  name: zen-cleaner
  namespace: ${WEBHOOK_NAMESPACE}
# yamllint disable rule:document-start
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zen-cleaner
rules:
  # Read and update ZenCleanerPolicy CRDs (controller only needs to read policies and update status)
  - apiGroups:
      - cleaner.zen-mesh.io
    resources:
      - zencleanerpolicies
    verbs:
      - get
      - list
      - watch
  # Update status subresource only (controller manages status, not spec)
  - apiGroups:
      - cleaner.zen-mesh.io
    resources:
      - zencleanerpolicies/status
    verbs:
      - get
      - update
      - patch
  # Read and delete any resource (for cleanup operations)
  - apiGroups:
      - "*"
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
      - delete
  # Read namespaces (for namespace filtering)
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
  # Leader election (leases)
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  # Events (for event recording)
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
# yamllint disable rule:document-start
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zen-cleaner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: zen-cleaner
subjects:
  - kind: ServiceAccount
    name: zen-cleaner
    namespace: ${WEBHOOK_NAMESPACE}
