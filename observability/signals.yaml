  - {id: zen.cleaner.dry_run.candidates.total, type: METRIC, owner_repo: zen-cleaner, component: zen-cleaner, kind: counter, unit: "1", coverage: {declared: true, registered: false, wired: true, observed: true}, evidence: ["qual/evidence/support2-043"]}
