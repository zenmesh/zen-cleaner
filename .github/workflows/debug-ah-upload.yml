name: Debug AH upload session

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Probe GHCR upload session semantics (redacted output)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AH_PUSH_TRACE: "1"
        run: |
          set -uo pipefail
          echo "=== REAL RELEASE SCRIPT (exact artifact CI executes) ==="
          if python3 scripts/push-artifacthub-metadata.py \
              ghcr.io/zenmesh/charts/zen-cleaner docs/artifacthub-repo.yml \
              "$GITHUB_ACTOR" "$GH_TOKEN"; then
            echo "RESULT: release script SUCCEEDED in probe context"
            exit 0
          fi
          echo "=== release script FAILED here too — shape battery follows ==="
          python3 scripts/debug-ghcr-upload-session.py \
            ghcr.io/zenmesh/charts/zen-cleaner docs/artifacthub-repo.yml \
            "$GITHUB_ACTOR" "$GH_TOKEN"
