# THE SINGLE CONSISTENT PUBLIC RELEASE PATH (MON soft-launch closure
# 2026-10-15): ghcr.io/zenmesh/zen-cleaner, published with the BUILT-IN
# GITHUB_TOKEN (packages:write — no external registry credential, no token
# proliferation). The previous thin caller delegated to the external
# zen-mesh/zen-oss-standards reusable workflow (404/not publicly available,
# secrets:inherit) and build-multiarch.yml set push=false on login failure —
# a green build that silently published NOTHING. Both are gone: this
# workflow FAILS VISIBLY on any login/build/push failure.
name: Release Image

on:
  push:
    tags:
      - 'v*'
      - '*.*.*-*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io (built-in GITHUB_TOKEN)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/zenmesh/zen-cleaner
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value={{sha}}
          labels: |
            org.opencontainers.image.source=https://github.com/zenmesh/zen-cleaner

      - name: Build and push (failure is visible)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Verify and record the published digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if ! [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Build did not return a valid published image digest"
            exit 1
          fi
          IMAGE_REF="ghcr.io/zenmesh/zen-cleaner@$IMAGE_DIGEST"
          docker buildx imagetools inspect "$IMAGE_REF"
          echo "Published: $IMAGE_REF"
          echo "Published image: \`$IMAGE_REF\`" >> "$GITHUB_STEP_SUMMARY"
# FIRST-PUBLISH NOTE: a package created by GITHUB_TOKEN defaults to PRIVATE.
# The one-time visibility step (package settings -> public) is an owner
# action recorded in RELEASING.md; anonymous pulls stay denied until then.
