name: Release Image

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*', 'v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cleaner-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate release version and chart binding
        id: version
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          test "$REF_TYPE" = tag
          VERSION="${TAG#v}"
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          test "$(awk '$1 == "version:" {print $2}' deploy/helm/zen-cleaner/Chart.yaml)" = "$VERSION"
          test "$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' deploy/helm/zen-cleaner/Chart.yaml)" = "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push release image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/zenmesh/zen-cleaner:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/zenmesh/zen-cleaner
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
      - name: Verify published image manifest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker buildx imagetools inspect "ghcr.io/zenmesh/zen-cleaner@$DIGEST"
          echo "Image: ghcr.io/zenmesh/zen-cleaner@$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  chart:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.image.outputs.version }}
      IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Bind chart to the exact published image
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import os, pathlib, re
          p = pathlib.Path('deploy/helm/zen-cleaner/values.yaml')
          s = p.read_text()
          s, n = re.subn(r'(?m)^  digest: .*$', '  digest: "' + os.environ['IMAGE_DIGEST'] + '"', s, count=1)
          assert n == 1
          p.write_text(s)
          PYCODE
          helm lint ./deploy/helm/zen-cleaner
          helm template zen-cleaner ./deploy/helm/zen-cleaner --namespace zen-cleaner-system > /tmp/rendered.yaml
          grep -F "ghcr.io/zenmesh/zen-cleaner@$IMAGE_DIGEST" /tmp/rendered.yaml
      - name: Package and publish public chart candidate
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm package ./deploy/helm/zen-cleaner -d /tmp/chart-out
          helm push "/tmp/chart-out/zen-cleaner-$VERSION.tgz" oci://ghcr.io/zenmesh/charts
          cd /tmp/chart-out
          sha256sum "zen-cleaner-$VERSION.tgz" > "zen-cleaner-$VERSION.tgz.sha256"
      - name: Build the public HTTP chart repository index
        run: |
          set -euo pipefail
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          PREVIOUS="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/index.yaml"
          if curl --fail --silent --show-error --location "$PREVIOUS" -o /tmp/previous-index.yaml; then
            helm repo index /tmp/chart-out --url "$BASE" --merge /tmp/previous-index.yaml
          else
            helm repo index /tmp/chart-out --url "$BASE"
          fi
          printf 'owners:\n  - name: Zen Mesh\n    email: zen@zen-mesh.io\n' > /tmp/chart-out/artifacthub-repo.yml
      - name: Create release and attach chart with checksum
        run: |
          set -euo pipefail
          printf '## Zen Cleaner %s\n\nImage: `ghcr.io/zenmesh/zen-cleaner@%s`\n\nChart: `oci://ghcr.io/zenmesh/charts/zen-cleaner` version `%s`\n\nIndependent Apache-2.0 Kubernetes cleanup controller. This is a 0.x release with a v1alpha1 policy API; review the repository install and safety guidance.\n' "$VERSION" "$IMAGE_DIGEST" "$VERSION" > /tmp/notes.md
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$VERSION" == *-* ]]; then
              gh release create "$RELEASE_TAG" --verify-tag --prerelease --title "Zen Cleaner $VERSION" --notes-file /tmp/notes.md
            else
              gh release create "$RELEASE_TAG" --verify-tag --title "Zen Cleaner $VERSION" --notes-file /tmp/notes.md
            fi
          fi
          gh release upload "$RELEASE_TAG" "/tmp/chart-out/zen-cleaner-$VERSION.tgz" "/tmp/chart-out/zen-cleaner-$VERSION.tgz.sha256" /tmp/chart-out/index.yaml /tmp/chart-out/artifacthub-repo.yml
          echo "Public Helm repository: https://github.com/$GITHUB_REPOSITORY/releases/latest/download" >> "$GITHUB_STEP_SUMMARY"
          echo "Chart: oci://ghcr.io/zenmesh/charts/zen-cleaner version $VERSION" >> "$GITHUB_STEP_SUMMARY"
