name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      
      - name: Verify Go version
        run: |
          go version
          EXPECTED="$(awk '$1=="go" {print $2}' go.mod)"
          if ! go version | grep -q "go$EXPECTED"; then
            echo "❌ Go version does not match go.mod (expected go$EXPECTED)"
            exit 1
          fi
          echo "✅ Go version matches go.mod (go$EXPECTED)"
      
      - name: Install dependencies
        run: go mod download
      
      - name: Install golangci-lint
        run: |
          echo "Installing golangci-lint v2 with Go 1.27..."
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          GOBIN=$(go env GOPATH)/bin
          echo "$GOBIN" >> $GITHUB_PATH
          echo "Verifying golangci-lint installation..."
          $GOBIN/golangci-lint version
          echo "golangci-lint installed successfully"
      
      - name: Run golangci-lint
        run: |
          GOBIN=$(go env GOPATH)/bin
          $GOBIN/golangci-lint run --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      
      - name: Install dependencies
        run: go mod download
      
      - name: Install bc
        run: sudo apt-get update && sudo apt-get install -y bc

      - name: Install envtest binaries (real kube-apiserver + etcd)
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.25
          SETUP_ENVTEST_BIN="$(go env GOPATH)/bin/setup-envtest"
          ASSETS="$("$SETUP_ENVTEST_BIN" use 1.35.0 --bin-dir "$HOME/.local/share/kubebuilder-envtest" -p path)"
          test -x "$ASSETS/kube-apiserver" && test -x "$ASSETS/etcd"
          echo "KUBEBUILDER_ASSETS=$ASSETS" >> "$GITHUB_ENV"
          echo "envtest assets: $ASSETS"

      - name: Run tests (includes the REAL API-server suite; a skip here is a failure signal, not a pass)
        env:
          KUBEBUILDER_ASSETS: ${{ env.KUBEBUILDER_ASSETS }}
        run: |
          go test -v -race -timeout=15m ./...
          go test -json ./test/apiserver/... -count=1 | tee /tmp/apiserver-tests.json >/dev/null
          python3 - <<'PY'
          import json
          ran = passed = skipped = 0
          for line in open('/tmp/apiserver-tests.json'):
              try: e = json.loads(line)
              except Exception: continue
              if e.get('Action') == 'run' and e.get('Test', '').startswith('TestRealAPIServer'):
                  ran += 1
              if e.get('Action') == 'pass' and e.get('Test', '').startswith('TestRealAPIServer'):
                  passed += 1
              if e.get('Action') == 'skip' and e.get('Test', '').startswith('TestRealAPIServer'):
                  skipped += 1
          print(f'real-API tests: ran={ran} passed={passed} skipped={skipped}')
          if ran == 0 or skipped:
              raise SystemExit('REAL API-server tests did not RUN — skips are not passes')
          if passed != ran:
              raise SystemExit('REAL API-server failures present')
          PY
      
      - name: Check coverage
        run: make coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      
      - name: Install dependencies
        run: go mod download
      
      - name: Build
        run: |
          mkdir -p bin
          go build -o bin/zen-cleaner ./cmd/zen-cleaner
      
      - name: Verify binary
        run: |
          if [ ! -f bin/zen-cleaner ]; then
            echo "Binary not found"
            exit 1
          fi
          file bin/zen-cleaner

  standalone-supply-chain:
    name: Standalone OSS — credential-free build + private-dependency guards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # THE CREDENTIAL-FREE LAW: the standalone OSS build must succeed with
      # an EMPTY module cache, NO git credentials (global/system config
      # discarded), NO SSH agent, NO private proxy and NO inherited
      # authentication — public dependencies only, from the public proxy.
      - name: Credential-free cold build + module verify
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_TERMINAL_PROMPT: '0'
          SSH_AUTH_SOCK: ''
          GOPROXY: 'https://proxy.golang.org,direct'
          GOPRIVATE: ''
        run: |
          CACHEDIR="$(mktemp -d)"
          export GOMODCACHE="$CACHEDIR/gomodcache"
          export GOCACHE="$CACHEDIR/gocache"
          go build ./...
          go mod verify
          echo "credential-free cold build OK (public module graph verified)"

      # THE PRIVATE-DEPENDENCY LAWS (test/repo guard battery): direct,
      # transitive, test and build graph scans; nested-module, replace,
      # vendor, build-tag, generated-file, embed and binary leakage
      # rejection — including the no-private-module-exception closure (self is the
      # only lawful zenmesh domain).
      - name: Private-dependency guard battery
        run: go test ./test/repo/... -count=1
